version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: skymetrics_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: skymetrics_db
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d skymetrics_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}

  backend:
    build:
      context: ./core/skyMetrics
      dockerfile: Dockerfile
    container_name: skymetrics_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/skymetrics_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      PYTHON_SERVICE_URL: http://flightlog:8000/api/analyze
      PYTHON_SERVICE_LLM_URL: http://flightlog:8000/call_llm
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  flightlog:
    build:
      context: ./python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      GENAI_API_KEY: ${GENAI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}

volumes:
  postgres_data:
