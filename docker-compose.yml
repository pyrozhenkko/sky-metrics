version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  skymetrics:
    build:
      context: ./core/skyMetrics
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

  flightlog:
    build:
      context: ./python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
